<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falta tanto, para introducir la demanda enmendada</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        },
                        gold: '#d97706',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Elementos Decorativos de Fondo -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 -left-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 right-1/3 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Encabezado Principal -->
    <header class="relative z-10 w-full max-w-4xl mx-auto pt-10 px-6 text-center">
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-sm font-medium mb-6">
            <i class="fa-regular fa-calendar-check text-blue-400"></i>
            <span>Fecha Límite: 10 de Noviembre de 2026</span>
        </div>
        <h1 class="text-3xl md:text-5xl lg:text-6xl font-extrabold text-white tracking-tight leading-tight">
            Falta poco, para introducir la <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">demanda enmendada</span>.
        </h1>
    </header>

    <!-- Contenido Principal - Contador -->
    <main class="relative z-10 my-auto py-10 px-4 w-full max-w-5xl mx-auto">
        <div class="bg-slate-800/60 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-6 md:p-12 shadow-2xl">
            
            <!-- Grid de Unidades de Tiempo -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 text-center">
                
                <!-- Días -->
                <div class="bg-slate-900/80 border border-slate-700/50 rounded-2xl p-4 md:p-6 shadow-inner flex flex-col justify-center">
                    <span id="days" class="text-4xl md:text-6xl lg:text-7xl font-extrabold text-blue-400 font-mono tracking-tight">00</span>
                    <span class="text-xs md:text-sm font-semibold uppercase tracking-widest text-slate-400 mt-2">Días</span>
                </div>

                <!-- Horas -->
                <div class="bg-slate-900/80 border border-slate-700/50 rounded-2xl p-4 md:p-6 shadow-inner flex flex-col justify-center">
                    <span id="hours" class="text-4xl md:text-6xl lg:text-7xl font-extrabold text-blue-400 font-mono tracking-tight">00</span>
                    <span class="text-xs md:text-sm font-semibold uppercase tracking-widest text-slate-400 mt-2">Horas</span>
                </div>

                <!-- Minutos -->
                <div class="bg-slate-900/80 border border-slate-700/50 rounded-2xl p-4 md:p-6 shadow-inner flex flex-col justify-center">
                    <span id="minutes" class="text-4xl md:text-6xl lg:text-7xl font-extrabold text-blue-400 font-mono tracking-tight">00</span>
                    <span class="text-xs md:text-sm font-semibold uppercase tracking-widest text-slate-400 mt-2">Minutos</span>
                </div>

                <!-- Segundos -->
                <div class="bg-slate-900/80 border border-slate-700/50 rounded-2xl p-4 md:p-6 shadow-inner flex flex-col justify-center">
                    <span id="seconds" class="text-4xl md:text-6xl lg:text-7xl font-extrabold text-amber-400 font-mono tracking-tight">00</span>
                    <span class="text-xs md:text-sm font-semibold uppercase tracking-widest text-slate-400 mt-2">Segundos</span>
                </div>
            </div>

            <!-- Botones para Ajustar Hora Objetivo del Día 10 -->
            <div class="mt-8 pt-6 border-t border-slate-700/40 flex flex-col sm:flex-row items-center justify-between gap-4">
                <span class="text-xs md:text-sm text-slate-400 flex items-center gap-2">
                    <i class="fa-regular fa-clock"></i> Hora objetivo del día 10 de Noviembre:
                </span>
                <div class="flex flex-wrap justify-center gap-2">
                 
                    
                </div>
            </div>

            <!-- Mensaje de Cierre / Triunfo -->
            <div class="mt-8 text-center">
                <div class="inline-block p-1 rounded-2xl bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-500">
                    <div class="bg-slate-900 px-6 py-4 rounded-[14px]">
                        <p class="text-2xl md:text-3xl lg:text-4xl font-black text-amber-400 tracking-wide font-serif italic">
                            ¡Petroamigos triunfará!
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Pie de página -->
    <footer class="relative z-10 w-full text-center py-6 text-slate-500 text-xs">
        <p>© 2026 Conteo Regresivo — Demanda Enmendada</p>
    </footer>

    <!-- Script de Conteo Regresivo -->
    <script>
        // Configuración de la fecha meta: 10 de Noviembre de 2026
        let targetHour = 23;
        let targetMinute = 59;
        let targetSecond = 59;

        function updateCountdown() {
            const targetDate = new Date(2026, 10, 10, targetHour, targetMinute, targetSecond); // 10 de Noviembre de 2026
            const now = new Date();
            const difference = targetDate.getTime() - now.getTime();

            if (difference <= 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days.toString().padStart(2, '0');
            document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
        }

        function setTargetTime(h, m, s) {
            targetHour = h;
            targetMinute = m;
            targetSecond = s;

            // Actualizar estado de los botones
            const btnEnd = document.getElementById('btn-end');
            const btnWork = document.getElementById('btn-work');
            const btnNoon = document.getElementById('btn-noon');

            const activeClass = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white transition-all shadow-md";
            const inactiveClass = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition-all";

            btnEnd.className = (h === 23) ? activeClass : inactiveClass;
            btnWork.className = (h === 17) ? activeClass : inactiveClass;
            btnNoon.className = (h === 12) ? activeClass : inactiveClass;

            updateCountdown();
        }

        // Ejecutar conteo de inmediato y cada 1 segundo
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
